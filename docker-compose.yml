services:
  health:
    image: registry.home.arpa/statalytics-health:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/health/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-health:latest
    restart: unless-stopped
    ports:
      - "8012:8000"


  renderer:
    image: registry.home.arpa/statalytics-renderer:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/renderer/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-renderer:latest
    volumes:
      - logs:/app/logs
    restart: unless-stopped


  bot:
    image: registry.home.arpa/statalytics-bot:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/bot/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-bot:latest
    env_file:
      - ./.env
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped


  trackers:
    image: registry.home.arpa/statalytics-trackers:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/bot/trackers.dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-trackers:latest
    env_file:
      - ./.env
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped


  utils:
    image: registry.home.arpa/statalytics-utils:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/utils/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-utils:latest
    env_file:
      - ./.env
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped


  website:
    image: registry.home.arpa/statalytics-website:${VERSION}
    build:
      context: ./
      dockerfile: ./apps/website/Dockerfile
      target: runner
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-website:latest
    env_file:
      - ./.env
    volumes:
      - logs:/app/logs
      - database:/app/database
    ports:
      - "${WEBSITE_PORT}:443"
    restart: unless-stopped


  skins:
    image: registry.home.arpa/statalytics-skins:${VERSION}
    build:
      context: ./apps/skins/
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-skins:latest
    restart: unless-stopped


  redis:
    image: registry.home.arpa/statalytics-redis:${VERSION}
    build:
      context: ./apps/redis/
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - registry.home.arpa/statalytics-redis:latest
    env_file:
      - ./.env
    volumes:
      - redis_data:/data
    restart: unless-stopped


volumes:
  database:
  logs:
  redis_data:

services:
  health:
    image: registry.home.arpa/statalytics-health:latest
    restart: unless-stopped
    ports:
      - "8012:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/health/healthcheck.py"]
      interval: 120s
      retries: 3
      start_period: 3s
      timeout: 5s

  renderer:
    image: registry.home.arpa/statalytics-renderer:latest
    volumes:
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /app/renderer/healthcheck.sh"]
      interval: 120s
      retries: 3
      start_period: 3s
      timeout: 5s

  bot:
    image: registry.home.arpa/statalytics-bot:latest
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/bot/healthcheck.py"]
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 5s

  trackers:
    image: registry.home.arpa/statalytics-trackers:latest
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/bot/healthcheck.trackers.py"]
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 5s

  utils:
    image: registry.home.arpa/statalytics-utils:latest
    volumes:
      - logs:/app/logs
      - database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/utils/healthcheck.py"]
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 5s

  website:
    image: registry.home.arpa/statalytics-website:latest
    volumes:
      - logs:/app/logs
      - database:/app/database
    environment:
      - WEBSITE_PORT=8000
    ports:
      - "${WEBSITE_PORT:-8000}:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/website/healthcheck.py"]
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 5s

  skins:
    image: registry.home.arpa/statalytics-skins:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 /usr/local/bin/healthcheck.py"]
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 5s

  redis:
    image: registry.home.arpa/statalytics-redis:latest
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /usr/local/bin/healthcheck.sh"]
      interval: 120s
      retries: 3
      start_period: 3s
      timeout: 5s


volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/statalytics/database
  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/statalytics/logs
  redis_data:
